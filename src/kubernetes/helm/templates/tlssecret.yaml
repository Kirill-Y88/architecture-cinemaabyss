{{- if and .Values.ingress.enabled .Values.tlsSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ (index .Values.ingress.tls 0).secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tlsSecret.crt }}
  tls.key: {{ .Values.tlsSecret.key }}
{{- end }}
